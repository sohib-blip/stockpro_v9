name: Staging checks

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ENABLE_LOW_STOCK_EMAILS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      # Pre-existing lint problems remain, so the lint does not need to be
      # clean: it fails only when the total goes above LINT_MAX_PROBLEMS, which
      # blocks new problems. Lower the ceiling whenever the code is cleaned up.
      - name: Lint (ceiling)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          LINT_MAX_PROBLEMS: "86"
        run: |
          npx eslint . --format json --output-file "$RUNNER_TEMP/eslint-report.json" || true
          node scripts/lint-report.mjs "$RUNNER_TEMP/eslint-report.json"

      # Fails only on high or critical advisories in the packages shipped with
      # the site; accepted moderate ones (minimatch via exceljs) do not block.
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high
